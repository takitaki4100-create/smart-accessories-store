<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>تم طلبك بنجاح | Smart Accessories</title></head><body><main class="admin"><div class="adminpanel success"><div class="check">✓</div><h1>تم طلبك بنجاح</h1><p>شكراً لثقتك في Smart Accessories</p><div id="details">جارٍ تحميل تفاصيل الطلب...</div><a class="btn" href="/">العودة إلى المتجر</a></div></main><script>
const money=n=>new Intl.NumberFormat('ar-DZ').format(Math.round(n))+' دج';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const id=new URLSearchParams(location.search).get('id');try{const r=await fetch('/api/orders/'+id);const o=await r.json();if(!r.ok)throw Error();document.querySelector('#details').innerHTML=`<h2>رقم الطلب: #${o.id}</h2><p>${esc(o.customer_name)} · ${esc(o.phone)}</p><p>${esc(o.wilaya)}، ${esc(o.municipality)}، ${esc(o.address)}</p><div>${o.items.map(i=>`<div class="cartline"><div><img src="${esc(i.image)}" style="width:65px;height:55px;object-fit:contain;float:right;margin-left:8px"><b>${esc(i.name)}</b><small>${i.quantity} × ${money(i.unit_price)}</small></div><b>${money(i.line_total)}</b></div>`).join('')}</div><h2>المجموع: ${money(o.total)}</h2><p class="muted">تاريخ الطلب: ${new Date(o.created_at+'Z').toLocaleString('ar-DZ')}</p>`}catch{document.querySelector('#details').textContent='تعذر العثور على الطلب.'}})();</script></body></html>
