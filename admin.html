<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>لوحة الإدارة | Smart Accessories</title></head><body><main class="admin"><a href="/" class="brand">▣ Smart <b>Accessories</b> ← المتجر</a><div id="loginBox" class="adminpanel"><h1>تسجيل دخول المدير</h1><form id="loginForm"><input name="username" placeholder="اسم المستخدم" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="btn full">دخول آمن</button></form><p class="muted">غيّر بيانات الدخول من ملف .env قبل النشر.</p></div><div id="dashboard" hidden><div class="sectionhead"><h1>لوحة التحكم</h1><button class="btn" id="logout">تسجيل الخروج</button></div><div class="adminpanel"><h2>إضافة / تعديل منتج</h2><form id="productForm"><input type="hidden" name="id"><div class="gridform"><input name="name" placeholder="اسم المنتج" required><select name="category_id" id="categorySelect"></select><textarea name="description" placeholder="وصف المنتج"></textarea><input name="image" placeholder="رابط الصورة (أو ارفع صورة أدناه)"><label>رفع صورة من الهاتف <input type="file" id="imageFile" accept="image/*"></label><input name="price" type="number" min="0" placeholder="سعر البداية دج" required><input name="retail_price" type="number" min="0" placeholder="سعر التجزئة"><input name="wholesale_price" type="number" min="0" placeholder="سعر الجملة"><input name="wholesale_min_qty" type="number" min="1" placeholder="بداية الجملة بالقطع"><input name="discount_step" type="number" min="0" placeholder="تخفيض لكل قطعة إضافية دج"><input name="min_price" type="number" min="0" placeholder="الحد الأدنى للسعر"><input name="stock" type="number" min="0" placeholder="المخزون"><label><input name="featured" type="checkbox"> منتج مميز</label></div><button class="btn">حفظ المنتج</button><button type="button" class="btn" id="resetProduct">إلغاء التعديل</button></form></div><div class="adminpanel"><h2>المنتجات</h2><div class="tablewrap"><table><thead><tr><th>المنتج</th><th>السعر</th><th>المخزون</th><th>إجراءات</th></tr></thead><tbody id="productRows"></tbody></table></div></div><div class="adminpanel"><h2>إدارة الأقسام</h2><form id="categoryForm"><input name="name" placeholder="اسم القسم" required><input name="description" placeholder="وصف القسم"><input name="image" placeholder="رابط صورة القسم (اختياري)"><button class="btn">إضافة قسم</button></form><div id="categoryRows"></div></div><div class="adminpanel"><h2>الطلبات</h2><div class="gridform"><input id="orderSearch" placeholder="بحث بالاسم أو الهاتف أو رقم الطلب"><select id="orderStatus"><option value="">كل الحالات</option><option>جديد</option><option>قيد المعالجة</option><option>تم التأكيد</option><option>تم الشحن</option><option>تم التسليم</option><option>ملغى</option></select></div><button class="btn" id="refreshOrders">تحديث الطلبات</button><div id="orders"></div></div><div class="adminpanel"><h2>معلومات التواصل</h2><form id="settingsForm" class="gridform"><input name="store_name" placeholder="اسم المتجر"><input name="phone" placeholder="رقم الهاتف"><input name="whatsapp" placeholder="واتساب مع رمز الدولة"><input name="facebook" placeholder="رابط Facebook"><input name="instagram" placeholder="رابط Instagram"><input name="tiktok" placeholder="رابط TikTok"><input name="gmail" placeholder="رابط أو بريد Gmail"><input name="tagline" placeholder="الشعار"><input name="subtitle" placeholder="عبارة المتجر"><button class="btn">حفظ معلومات التواصل</button></form></div></div></main><div class="toast" id="toast"></div><script src="/admin.js"></script></body></html>
